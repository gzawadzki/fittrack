name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and lint
        run: ./gradlew test lintDebug --continue

  supabase-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check
        run: deno check supabase/functions/*/index.ts
      - name: Lint
        run: deno lint supabase/functions
      - name: Test
        run: deno test --allow-all supabase/functions
      - name: Coach evals
        run: deno run --allow-read evals/run.ts
